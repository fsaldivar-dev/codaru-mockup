<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codaru · Contenido intercambiable</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-rows:64px 1fr 32px;background:#f4f5f8;color:#252636;font:13px -apple-system,BlinkMacSystemFont,sans-serif}header{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid #dfe2eb;background:white}header strong{font-size:15px;margin-right:auto}button{font:inherit;border:1px solid #d8dce6;background:white;color:#303748;border-radius:7px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary{background:#7255db;color:white;border-color:#7255db}main{display:grid;grid-template-columns:260px minmax(400px,1fr) 300px;min-height:0}aside{background:white;min-height:0;display:flex;flex-direction:column;border-right:1px solid #dfe2eb}aside.right{border-right:0;border-left:1px solid #dfe2eb}.caption{font-size:11px;letter-spacing:.8px;padding:17px 14px 10px;color:#747c8b}.note{padding:14px;line-height:1.6;color:#6d7585;border-top:1px solid #eceef3}#layers-slot{flex:1;min-height:0}#library-slot{height:210px;overflow:auto}#canvas-slot,#inspector-slot{min-height:0;height:100%}#toolbar-slot{padding:10px;border-top:1px solid #eceef3}#dialogs-slot{height:0}footer{padding:8px 16px;background:white;color:#747c8b;border-top:1px solid #dfe2eb;font-size:11px}
.host-fields{padding:0 14px 14px;border-bottom:1px solid #eceef3;font-size:12px;line-height:1.6}.host-fields p{color:#747c8b;margin:0 0 12px}.host-fields label{display:block;margin:8px 0}.host-fields select,.host-fields input:not([type=checkbox]){display:block;width:100%;font:inherit;border:1px solid #d8dce6;border-radius:7px;padding:9px;margin-top:5px}.host-fields input[type=checkbox]{accent-color:#7255db}#host-error{color:#b4334d}</style></head><body><header><strong>Codaru / Contenido intercambiable</strong><button id="change-master" class="primary">Cambiar color del logo</button><button id="select-local">Seleccionar tarjeta</button><button id="undo">Deshacer</button><button id="fit">Ajustar</button></header><main><aside><div class="caption">CONTROLES DEL IDE</div><div class="host-fields"><p>Este panel pertenece a tu aplicación.</p><label>Título<input id="host-title" aria-label="Título desde el IDE"/></label><label>Cabecera<select id="host-content" aria-label="Cabecera desde el IDE"></select></label><span id="host-error" role="alert"></span></div><div class="caption">CAPAS</div><div id="layers-slot"></div><div class="caption">BIBLIOTECA</div><div id="library-slot"></div></aside><div id="canvas-slot"></div><aside class="right"><div class="caption">PROPIEDADES</div><div id="inspector-slot"></div><div class="note">Un espacio, un componente. Cambia la cabecera sin desarmar la tarjeta.</div><div id="toolbar-slot"></div></aside></main><footer id="status">Documento de ejemplo · Sin guardado automático</footer><div id="dialogs-slot"></div><script type="module" src="./slots-host.ts"></script></body></html>
