<!doctype html><html><head><style>body{display:flex;margin:0;font:14px sans-serif}.session{display:flex;flex-wrap:wrap;width:50vw;height:100vh;overflow:auto}.slot{width:320px;height:480px;border:1px solid #ccc}#host-control{color:red}</style></head><body><button id="host-control">IDE</button><script type="module">
import {createEditor} from '/src/editor-core.ts';
import {createIdentityLabView,renderIdentityEvidence} from '/src/identity-view.ts';
import {blank,node} from '/src/model.ts';
const records={};
function mount(id){const p=blank();p.nodes=[node('frame',{id:id+'-frame',name:'Pantalla '+id,x:0,y:0,width:300,height:400,fill:'#ffffff'}),node('rect',{id:id+'-rect',name:'Tarjeta',parentId:id+'-frame',x:30,y:40,width:200,height:100,fill:'#283472'})];const editor=createEditor({document:p});editor.upsertIdentityDirection({id:'concept',name:'Concepto',intent:'Precisión y claridad',frameIds:[id+'-frame'],styleIds:[],status:'selected'});const record={editor,requests:[],pending:null,exported:null,handles:{},slots:{}};editor.setIdentityServices({render:renderIdentityEvidence,review:request=>new Promise(resolve=>{record.requests.push(request);record.pending=resolve;}),refine:request=>{record.requests.push(request);return Promise.resolve({proposal:'Mover la tarjeta; conservar proporciones.'});},research:()=>Promise.resolve({references:[{id:'ref',title:'Autoría',source:'https://example.org/fuente',kind:'cultural',observations:'Estudio de ritmo.',status:'accepted'}]})});const host=document.createElement('section');host.className='session';host.dataset.instance=id;document.body.append(host);const lab=createIdentityLabView(editor,{appearance:{theme:'light'},onExport:data=>{record.exported=data;}});record.lab=lab;for(const part of ['brief','references','directions','reviews','decisions','handoff']){const slot=document.createElement('div');slot.className='slot';host.append(slot);record.slots[part]=slot;record.handles[part]=lab.mount(part,slot);}records[id]=record;editor.select([id+'-rect']);}
Object.assign(window,{identityTest:{records,mount}});
</script></body></html>
