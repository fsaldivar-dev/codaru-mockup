<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:17px;background:#eef0f4;font:15px Georgia;color:#193247}button{border:3px solid #117755;padding:9px;color:#114466}input{font:14px Georgia} .workspace{display:grid;grid-template-columns:200px minmax(440px,1fr) 280px;grid-template-rows:44px 520px 44px;gap:4px;margin-top:12px}.canvas{grid-column:2;grid-row:2}.layers{grid-column:1;grid-row:2}.inspector{grid-column:3;grid-row:2}.toolbar{grid-column:2;grid-row:1}.status{grid-column:2;grid-row:3}.library{height:320px;width:220px}.dialogs{height:0} .slot{min-width:0;min-height:0}
</style></head><body><button id="host-button">Acción del IDE</button><input id="host-input" aria-label="Texto del IDE"><div id="instances"></div><script type="module">
import {createEditor,createEditorView} from '/src/modular.ts';
import {blank,node} from '/src/model.ts';
const records={};
function mount(id, parts=['canvas','layers','inspector','toolbar','status','dialogs']){
 const p=blank();p.name=id;p.nodes=[node('frame',{id:id+'-frame',name:'Pantalla '+id,x:20,y:20,width:400,height:420}),node('rect',{id:id+'-rect',name:'Tarjeta '+id,parentId:id+'-frame',x:40,y:50,width:180,height:100})];
 const editor=createEditor({document:p,onChange:doc=>records[id].changes.push(doc)});const view=createEditorView(editor,{appearance:{theme:'light',tokens:{accent:'#007aff'}}});
 const host=document.createElement('section');host.dataset.instance=id;host.className='workspace';document.querySelector('#instances').append(host);
 const r=records[id]={editor,view,host,changes:[],states:[],handles:{},slots:{}};
 for(const part of parts){const slot=document.createElement('div');slot.className='slot '+part;host.append(slot);r.slots[part]=slot;r.handles[part]=view.mount(part,slot);}
 r.unsubscribe=editor.subscribe(state=>r.states.push(state));view.fit();return r;
}
window.modularTest={mount,records};
</script></body></html>
