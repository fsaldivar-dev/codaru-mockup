[package]
name = "tauri-plugin-codaru"
version = "0.8.0"
edition = "2021"
links = "tauri-plugin-codaru"
description = "Native dialogs and local agent bridge for an embedded Codaru editor"
license = "BSD-3-Clause"
repository = "https://github.com/fsaldivar-dev/codaru-mockup"
homepage = "https://github.com/fsaldivar-dev/codaru-mockup"
readme = "README.md"
keywords = ["tauri", "plugin", "mockup", "editor", "ipc"]
categories = ["gui", "development-tools"]
publish = false
include = [
    "Cargo.toml",
    "build.rs",
    "src/**/*.rs",
    "permissions/**/*.toml",
    "permissions/schemas/schema.json",
    "permissions/autogenerated/reference.md",
    "README.md",
    "LICENSE",
]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
