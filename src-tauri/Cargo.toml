[package]
name = "codaru-mockup"
version = "0.2.0"
edition = "2021"
default-run = "codaru-mockup"

[[bin]]
name = "codaru-mockup"
path = "src/main.rs"

[[bin]]
name = "codaru"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-codaru = { path = "../packages/tauri-plugin-codaru" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
